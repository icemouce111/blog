<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680" role="img" aria-labelledby="title desc">
  <title id="title">AI 知识库：逻辑连接与部署示意</title>
  <desc id="desc">浏览器通过 HTTPS 连接 Web 与反向代理入口，入口通过 HTTP 连接应用主机上的 API。API 和同机 Worker 连接 PostgreSQL，API 另通过 HTTPS 连接外部模型。连线表示连接发起方向。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#477757"/></marker></defs>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill: #192d23; }
    .heading { font-size: 32px; font-weight: 700; }
    .label { font-size: 27px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 23px; text-anchor: middle; fill: #43594c; }
    .edge { font-size: 22px; fill: #365a42; }
    .note { font-size: 22px; fill: #43594c; }
    .line { fill: none; stroke: #477757; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <rect width="800" height="680" rx="20" fill="#f3f7f3"/>
  <text x="32" y="51" class="heading">03 拓扑图 · 运行时怎么连</text>
  <rect x="42" y="320" width="280" height="280" rx="16" fill="#e7f0e7" stroke="#a7bdab" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="60" y="353" class="note">应用主机</text>
  <g fill="#fff" stroke="#a7bdab" stroke-width="2">
    <rect x="70" y="85" width="220" height="65" rx="12"/>
    <rect x="70" y="220" width="220" height="70" rx="12"/>
    <rect x="70" y="380" width="220" height="70" rx="12"/>
    <rect x="70" y="510" width="220" height="65" rx="12"/>
    <rect x="480" y="435" width="280" height="100" rx="12"/>
  </g>
  <rect x="480" y="220" width="280" height="70" rx="12" fill="#f9edda" stroke="#b98d50" stroke-width="2"/>
  <text x="180" y="128" class="label">浏览器</text>
  <text x="180" y="264" class="label">Web / 反向代理</text>
  <text x="180" y="424" class="label">API 进程</text>
  <text x="180" y="552" class="label">Worker 进程</text>
  <text x="620" y="264" class="label">外部模型服务</text>
  <text x="620" y="477" class="label">PostgreSQL</text>
  <text x="620" y="514" class="body">独立数据库节点</text>
  <path d="M180 150 V220" class="line"/>
  <text x="200" y="192" class="edge">HTTPS</text>
  <path d="M180 290 V380" class="line"/>
  <text x="205" y="315" class="edge">HTTP</text>
  <path d="M290 405 H355 V255 H480" class="line"/>
  <text x="372" y="243" class="edge">HTTPS</text>
  <path d="M290 432 H390 V465 H480" class="line"/>
  <path d="M290 542 H420 V507 H480" class="line"/>
  <text x="470" y="411" class="edge">数据库连接</text>
  <text x="32" y="643" class="note">箭头 = 连接发起方 → 目标；不表示执行先后。</text>
</svg>
