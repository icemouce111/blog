<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title desc">
  <title id="title">AI 知识库：功能结构图</title>
  <desc id="desc">AI 知识库包含文档管理、知识问答和历史记录。所有连线仅表示功能的包含关系。</desc>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill: #192d23; }
    .heading { font-size: 32px; font-weight: 700; }
    .label { font-size: 27px; font-weight: 600; text-anchor: middle; }
    .body { font-size: 24px; text-anchor: middle; fill: #43594c; }
    .note { font-size: 22px; fill: #43594c; }
  </style>
  <rect width="800" height="470" rx="20" fill="#f3f7f3"/>
  <text x="32" y="51" class="heading">01 结构图 · 有哪些部分</text>
  <rect x="250" y="90" width="300" height="68" rx="12" fill="#d8ebdb" stroke="#477757" stroke-width="2"/>
  <text x="400" y="133" class="label">AI 知识库</text>
  <path d="M400 158 V204 M144 238 V204 H656 V238 M400 204 V238" fill="none" stroke="#477757" stroke-width="3"/>
  <g fill="#fff" stroke="#a7bdab" stroke-width="2">
    <rect x="32" y="238" width="224" height="148" rx="12"/>
    <rect x="288" y="238" width="224" height="148" rx="12"/>
    <rect x="544" y="238" width="224" height="148" rx="12"/>
  </g>
  <text x="144" y="280" class="label">文档管理</text>
  <text x="144" y="324" class="body">上传文档</text>
  <text x="144" y="361" class="body">删除文档</text>
  <text x="400" y="280" class="label">知识问答</text>
  <text x="400" y="324" class="body">检索片段</text>
  <text x="400" y="361" class="body">生成回答</text>
  <text x="656" y="280" class="label">历史记录</text>
  <text x="656" y="324" class="body">保存会话</text>
  <text x="656" y="361" class="body">查看记录</text>
  <text x="32" y="436" class="note">连线 = 包含关系；不表达执行顺序或网络连接。</text>
</svg>
